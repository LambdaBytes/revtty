[package]
name = "revtty"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Outbound-only remote terminal for machines behind NAT"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LambdaBytes/revtty"
keywords = ["ssh", "terminal", "remote", "nat", "sysadmin"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
futures-util = "0.3"
getrandom = "0.4"
portable-pty = "0.9"
reqwest = { version = "0.13", features = ["json"] }
reqwest-websocket = "0.6"
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
sha2 = "0.11"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "getrandom", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

