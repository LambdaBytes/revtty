[package]
name = "revtty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Outbound-only remote terminal for machines behind NAT"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LambdaBytes/revtty"
keywords = ["ssh", "terminal", "remote", "nat", "sysadmin"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
