name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    timeout-minutes: 10
    name: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

  # ubuntu-latest moves to Ubuntu 26.04 between 2026-10-19 and 2026-11-19
  # (actions/runner-images#14748): this job runs the same checks there first. Its
  # own job id keeps its rust-cache apart from the 24.04 one, which would otherwise
  # skip rebuilding the C dependencies with 26.04's toolchain.
  ubuntu-26:
    timeout-minutes: 10
    name: ubuntu-26.04
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

  # Without a cache, as after a Cargo.lock or toolchain change, this job took 597 s of
  # its former 600 s limit on macos-26-arm64 (run 38744141526, 5m36s of it the release
  # build); with one, 4 to 5 minutes. Its limit leaves room for a run without a cache.
  macos:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[full ci]')
    timeout-minutes: 20
    name: macos-latest
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

      - name: launchd smoke test
        run: .github/scripts/launchd-smoke.sh

  # The macos job's checks, with its time limit, on an Intel Mac. Its first run starts
  # without a cache.
  macos-intel:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[full ci]')
    timeout-minutes: 20
    name: macos-26-intel
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

      - name: launchd smoke test
        run: .github/scripts/launchd-smoke.sh
